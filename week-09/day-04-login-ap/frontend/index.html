<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login App</title>
    <script src="script.js" defer></script>

     <!-- Import Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

      <style>
        * {
          box-sizing: border-box;
        }
  
        body {
          display: flex;
          flex-direction: column;
          align-items: center;
          font-family: "Montserrat", sans-serif;
          background-color: rgb(39, 37, 40);
          color: rgb(209, 211, 212);
          letter-spacing: 2px;
        }
        
        h1 {
            font-weight: 500;
        }
  
        .input-box {
          display: block;
          background-color: rgb(39, 37, 40);
          color: rgb(209, 211, 212);
          border: solid 1px rgba(128, 128, 128, 0.612);
          border-radius: 6px;
          margin: 5px 0;
          padding: 3px 10px;
        }
  
        .submit-button {
          width: 100%;
          cursor: pointer;
          border-radius: 4px;
          border: none;
          background-color: rgb(67, 87, 184);
          color: white;
          margin: 5px 0;
          padding: 8px 0;
        }
  
        .submit-button:hover {
          opacity: 0.7;
          box-shadow: 1px 1px 5px darkblue;
          transition: 0.5s;
        }
      </style>
      
</head>
<body>
    <h1>LOGIN APP</h1>

    <form id="login-form">
        <label>Email</label>
        <input type="email" class="input-box" id="email">
        <br>

        <label>Password</label>
        <input type="password" class="input-box" id="password">
        <br><br>

        <input type="submit" class="submit-button">

    </form>
    
    <!-- a div to display if the login was successful or not -->
     <div id="login-result"></div>
</body>
</html>
